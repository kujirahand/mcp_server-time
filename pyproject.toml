[project]
name = "time-mcp"
version = "0.1.0"
description = "MCP server that returns local time and time in arbitrary IANA timezones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1.1",
    "tzdata>=2024.1",
]

[project.scripts]
time-mcp = "time_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_mcp"]
